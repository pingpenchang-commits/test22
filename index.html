<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>三久太陽能</title>


    <!-- LINE LIFF SDK -->
    <script
        charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js">
    </script>


    <style>

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;

            background: #f5f5f5;

            padding: 20px;
        }


        .box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            max-width: 400px;

            margin: 0 auto;

            box-shadow:
                0 4px 10px
                rgba(0,0,0,0.08);
        }


.logo {
    text-align: center;
    margin-bottom: 20px;
}

.logo img {
    width: 100%;
    height: auto;
}



        .history-title {

            font-weight: bold;

            margin-bottom: 10px;

            color: #333;

            font-size: 15px;
        }


        label {

            display: block;

            margin-top: 12px;

            margin-bottom: 5px;

            color: #333;

            font-size: 14px;

            font-weight: bold;
        }


        input[type="text"],
        input[type="tel"],
        input[type="date"] {

            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 6px;

            font-size: 15px;

            background: #fff;
        }


        input[type="file"] {

            width: 100%;

            box-sizing: border-box;

            padding: 10px;

            background: #fafafa;

            border: 1px dashed #ccc;

            border-radius: 6px;
        }


        button {

            width: 100%;

            box-sizing: border-box;

            margin-top: 15px;

            padding: 12px;

            background: #003C9D;

            color: white;

            border: none;

            font-weight: bold;

            font-size: 16px;

            border-radius: 6px;

            cursor: pointer;
        }


        button:disabled {

            background: #999;
        }


        .gallery {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 20px;

            min-height: 50px;
        }


        .gallery img {

            width: 100%;

            height: auto;

            object-fit: contain;

            background: #f5f5f5;

            border-radius: 6px;

            border: 1px solid #ddd;
        }


        .status {

            text-align: center;

            color: #666;

            font-size: 14px;

            margin-top: 10px;
        }

    </style>

</head>


<body>


<div class="box">


<div class="logo">
    <img src="https://i.ibb.co/chRL8DY0/logo.jpg" alt="Logo">
</div>



    <!-- ==============================
         客戶資料
    =============================== -->

    <div class="history-title">
        客戶資料
    </div>


    <label for="customerName">
        姓名
    </label>

    <input
        type="text"
        id="customerName"
        placeholder="請輸入姓名"
    >


    <label for="phone">
        電話
    </label>

    <input
        type="tel"
        id="phone"
        placeholder="請輸入電話"
    >


    <label for="address">
        地址
    </label>

    <input
        type="text"
        id="address"
        placeholder="請輸入地址"
    >


    <label for="model">
        機型
    </label>

    <input
        type="text"
        id="model"
        placeholder="請輸入機型"
    >


    <label for="installDate">
        安裝日期
    </label>

    <input
        type="date"
        id="installDate"
    >


    <button
        id="saveCustomerBtn"
        onclick="saveCustomer()"
    >
        儲存客戶資料
    </button>


    <hr
        style="
            border:0;
            border-top:1px solid #eee;
            margin:20px 0;
        "
    >


    <!-- ==============================
         歷史照片
    =============================== -->

    <div class="history-title">
        您過去上傳的照片：
    </div>


    <div
        id="gallery"
        class="gallery"
    >
        正在讀取 LINE 身份中...
    </div>


    <hr
        style="
            border:0;
            border-top:1px solid #eee;
            margin:20px 0;
        "
    >


    <!-- ==============================
         上傳照片
    =============================== -->

    <div class="history-title">
        新增參考照片：
    </div>


    <input
        type="file"
        id="fileInput"
        accept="image/*"
    >


    <button
        id="uploadBtn"
        onclick="uploadPhoto()"
    >
        確認上傳照片
    </button>


    <div
        id="status"
        class="status">
    </div>


</div>


<script>


// =====================================================
// 請修改這兩個設定
// =====================================================

const GOOGLE_API_URL =
    "https://script.google.com/macros/s/AKfycbwsi-SWa-LZ_fc7gEjtNxkOSg-ZrkigDxol2SxfYD058epCl81ToMeAC4iXCTXAYFSb9Q/exec";


const MY_LIFF_ID =
    "2011256691-2xjeJiKc";


// =====================================================
// LINE User ID
// =====================================================

let user_id = "";


// =====================================================
// 初始化 LIFF
// =====================================================

async function initLIFF() {

    const gallery =
        document.getElementById("gallery");


    try {

        gallery.innerText =
            "正在連線 LINE...";


        await liff.init({

            liffId: MY_LIFF_ID

        });


        console.log(
            "LIFF initialized"
        );


        // 尚未登入
        if (!liff.isLoggedIn()) {

            gallery.innerText =
                "正在開啟 LINE 登入...";


            liff.login({

                redirectUri:
                    window.location.href

            });

            return;
        }


        // 取得 LINE Profile
        const profile =
            await liff.getProfile();


        console.log(
            "LINE Profile:",
            profile
        );


        if (
            !profile ||
            !profile.userId
        ) {

            throw new Error(
                "無法取得 LINE User ID"
            );
        }


        user_id =
            profile.userId;


        console.log(
            "LINE User ID:",
            user_id
        );


        gallery.innerText =
            "正在讀取您的資料...";


        // 同時讀取：
        // 客戶資料
        // 歷史照片

        await loadCustomer();

        await fetchHistoryPhotos(
            user_id
        );


    } catch (error) {

        console.error(
            "LIFF Error:",
            error
        );


        gallery.innerText =
            "LINE 身份讀取失敗：" +
            (error.message || error);
    }
}



// =====================================================
// 讀取客戶資料
// =====================================================

async function loadCustomer() {

    try {

        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getCustomer&userId=" +
                encodeURIComponent(user_id)

            );


        const data =
            await response.json();


        console.log(
            "Customer:",
            data
        );


        if (
            data.status === "success" &&
            data.customer
        ) {

            document.getElementById(
                "customerName"
            ).value =
                data.customer.name || "";


            document.getElementById(
                "phone"
            ).value =
                data.customer.phone || "";


            document.getElementById(
                "address"
            ).value =
                data.customer.address || "";


            document.getElementById(
                "model"
            ).value =
                data.customer.model || "";


            document.getElementById(
                "installDate"
            ).value =
                data.customer.installDate || "";
        }


    } catch (error) {

        console.error(
            "載入客戶資料失敗:",
            error
        );
    }
}



// =====================================================
// 儲存客戶資料
// =====================================================

async function saveCustomer() {

    if (!user_id) {

        alert(
            "尚未取得 LINE 身份，請重新整理。"
        );

        return;
    }


    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const address =
        document.getElementById(
            "address"
        ).value.trim();


    const model =
        document.getElementById(
            "model"
        ).value.trim();


    const installDate =
        document.getElementById(
            "installDate"
        ).value;


    if (!name) {

        alert("請輸入姓名");

        return;
    }


    const btn =
        document.getElementById(
            "saveCustomerBtn"
        );


    btn.disabled = true;

    btn.innerText =
        "儲存中...";


    try {

        const payload = {

            action: "saveCustomer",

            userId: user_id,

            name: name,

            phone: phone,

            address: address,

            model: model,

            installDate: installDate
        };


        const response =
            await fetch(

                GOOGLE_API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(payload)
                }
            );


        const data =
            await response.json();


        if (
            data.status === "success"
        ) {

            alert(
                "客戶資料已成功儲存！"
            );

        } else {

            alert(
                "儲存失敗：" +
                data.message
            );
        }


    } catch (error) {

        console.error(error);

        alert(
            "無法連線到伺服器"
        );

    } finally {

        btn.disabled = false;

        btn.innerText =
            "儲存客戶資料";
    }
}



// =====================================================
// 讀取歷史照片
// =====================================================

async function fetchHistoryPhotos(uid) {

    const gallery =
        document.getElementById(
            "gallery"
        );


    try {

        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getPhotos&userId=" +
                encodeURIComponent(uid)

            );


        const data =
            await response.json();


        gallery.innerHTML = "";


        if (
            !data ||
            data.length === 0
        ) {

            gallery.innerText =
                "尚無歷史照片紀錄";

            return;
        }


        data.forEach(
            function(url) {

                const img =
                    document.createElement(
                        "img"
                    );


                img.src = url;


                img.loading = "lazy";


                gallery.appendChild(img);

            }
        );


    } catch (error) {

        console.error(error);

        gallery.innerText =
            "無法載入雲端相簿紀錄";
    }
}



// =====================================================
// 上傳照片
// =====================================================

function uploadPhoto() {

    const fileInput =
        document.getElementById(
            "fileInput"
        );


    if (
        fileInput.files.length === 0
    ) {

        alert(
            "請先選擇照片"
        );

        return;
    }


    if (!user_id) {

        alert(
            "尚未讀取到您的 LINE 帳號身份，請重新整理網頁"
        );

        return;
    }


    const file =
        fileInput.files[0];


    // 檢查圖片大小
    // 這裡限制 10MB

    if (
        file.size >
        10 * 1024 * 1024
    ) {

        alert(
            "照片不能超過 10MB"
        );

        return;
    }


    const btn =
        document.getElementById(
            "uploadBtn"
        );


    btn.innerText =
        "照片上傳中...";


    btn.disabled = true;


    const reader =
        new FileReader();


    reader.readAsDataURL(file);


    reader.onload =
        function() {

            try {

                const base64Parts =
                    reader.result.split(",");


                const base64String =
                    base64Parts[1];


                const payload = {

                    action: "upload",

                    userId: user_id,

                    filename: file.name,

                    mimeType: file.type,

                    data: base64String

                };


                fetch(

                    GOOGLE_API_URL,

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }

                )

                .then(
                    response =>
                        response.json()
                )

                .then(
                    function(data) {

                        if (
                            data.status ===
                            "success"
                        ) {

                            alert(
                                "上傳成功！"
                            );


                            // 重新載入照片

                            fetchHistoryPhotos(
                                user_id
                            );


                            fileInput.value =
                                "";


                        } else {

                            alert(
                                "上傳失敗：" +
                                data.message
                            );
                        }


                        resetUploadButton();

                    }
                )

                .catch(
                    function(error) {

                        console.error(
                            error
                        );


                        alert(
                            "照片上傳失敗，請確認網路及 GAS 部署設定。"
                        );


                        resetUploadButton();
                    }
                );


            } catch (error) {

                console.error(
                    error
                );

                resetUploadButton();
            }
        };
}



// =====================================================
// 重設上傳按鈕
// =====================================================

function resetUploadButton() {

    const btn =
        document.getElementById(
            "uploadBtn"
        );


    btn.innerText =
        "確認上傳照片";


    btn.disabled = false;
}



// =====================================================
// 啟動
// =====================================================

initLIFF();


</script>

</body>

</html>
