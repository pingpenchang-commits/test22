<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>三久太陽能｜經銷商後台</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;

            color: #333;
        }


        .container {

            max-width: 900px;

            margin: 0 auto;
        }


        /* ==================================================
           登入區
        ================================================== */

        .login-box {

            max-width: 400px;

            margin: 50px auto;

            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);
        }


        .logo {

            text-align: center;

            margin-bottom: 25px;
        }


        .logo img {

            width: 100%;

            max-width: 320px;

            height: auto;
        }


        .title {

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            color: #003C9D;

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-size: 14px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;

            background: #fff;
        }


        input:focus {

            outline: none;

            border-color: #003C9D;

            box-shadow:
                0 0 0 2px
                rgba(0,60,157,0.08);
        }


        button {

            width: 100%;

            padding: 12px;

            margin-top: 18px;

            border: none;

            border-radius: 7px;

            background: #003C9D;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #002d75;
        }


        button:disabled {

            background: #999;

            cursor: not-allowed;
        }


        .message {

            text-align: center;

            margin-top: 12px;

            font-size: 14px;

            color: #d00;
        }


        /* ==================================================
           後台
        ================================================== */

        #dashboard {

            display: none;
        }


        .header {

            background: white;

            padding: 18px 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.06);

            margin-bottom: 15px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .header-title {

            font-size: 20px;

            font-weight: bold;

            color: #003C9D;
        }


        .dealer-name {

            font-size: 14px;

            color: #666;

            margin-top: 4px;
        }


        .logout-btn {

            width: auto;

            margin: 0;

            padding: 9px 16px;

            font-size: 14px;

            background: #666;
        }


        .logout-btn:hover {

            background: #444;
        }


        /* ==================================================
           客戶列表
        ================================================== */

        .card {

            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.06);

            margin-bottom: 15px;
        }


        .card-title {

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 15px;

            color: #333;
        }


        .search {

            margin-bottom: 15px;
        }


        .customer-list {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .customer-item {

            padding: 15px;

            border: 1px solid #eee;

            border-radius: 9px;

            cursor: pointer;

            transition: 0.2s;

            background: #fff;
        }


        .customer-item:hover {

            background: #f5f8ff;

            border-color: #003C9D;
        }


        .customer-name {

            font-weight: bold;

            font-size: 16px;

            color: #003C9D;

            margin-bottom: 5px;
        }


        .customer-info {

            font-size: 13px;

            color: #666;

            line-height: 1.7;
        }


        .empty {

            text-align: center;

            color: #888;

            padding: 20px;
        }


        /* ==================================================
           客戶詳細資料
        ================================================== */

        #customerDetail {

            display: none;
        }


        .back-btn {

            background: #777;

            margin-top: 0;

            margin-bottom: 15px;
        }


        .back-btn:hover {

            background: #555;
        }


        .info-row {

            display: flex;

            border-bottom: 1px solid #eee;

            padding: 10px 0;

            gap: 10px;
        }


        .info-label {

            width: 90px;

            flex-shrink: 0;

            font-weight: bold;

            color: #555;
        }


        .info-value {

            flex: 1;

            word-break: break-word;
        }


        /* ==================================================
           照片
        ================================================== */

        .photo-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(140px, 1fr)
                );

            gap: 10px;
        }


        .photo-item {

            background: #f5f5f5;

            border-radius: 8px;

            overflow: hidden;

            border: 1px solid #ddd;
        }


        .photo-item img {

            display: block;

            width: 100%;

            height: 150px;

            object-fit: cover;

            cursor: pointer;
        }


        .photo-name {

            padding: 7px;

            font-size: 11px;

            color: #666;

            word-break: break-all;
        }


        /* ==================================================
           維修紀錄
        ================================================== */

        .repair-item {

            border: 1px solid #eee;

            border-radius: 9px;

            padding: 15px;

            margin-bottom: 10px;

            background: #fafafa;
        }


        .repair-date {

            color: #003C9D;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .repair-row {

            font-size: 14px;

            line-height: 1.7;
        }


        .repair-label {

            font-weight: bold;

            color: #555;
        }


        /* ==================================================
           維修表單
        ================================================== */

        .repair-form {

            margin-top: 15px;

            padding-top: 15px;

            border-top: 1px solid #eee;
        }


        textarea {

            width: 100%;

            min-height: 90px;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 15px;

            resize: vertical;
        }


        /* ==================================================
           修改帳號密碼
        ================================================== */

        .account-box {

            background: #f8f9fb;

            border: 1px solid #eee;

            padding: 15px;

            border-radius: 9px;

            margin-top: 10px;
        }


        .danger-btn {

            background: #b42318;
        }


        .danger-btn:hover {

            background: #8f1c14;
        }


        /* ==================================================
           Loading
        ================================================== */

        .loading {

            text-align: center;

            color: #666;

            padding: 20px;
        }


        /* ==================================================
           RWD
        ================================================== */

        @media (max-width: 600px) {

            body {

                padding: 10px;
            }


            .header {

                align-items: flex-start;
            }


            .photo-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .photo-item img {

                height: 130px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         登入頁面
    ================================================== -->

    <div
        id="loginPage"
        class="login-box"
    >

        <div class="logo">

            <img
                src="https://i.ibb.co/chRL8DY0/logo.jpg"
                alt="三久太陽能"
            >

        </div>


        <div class="title">

            經銷商後台

        </div>


        <label for="username">

            帳號

        </label>


        <input
            type="text"
            id="username"
            placeholder="請輸入帳號"
            autocomplete="username"
        >


        <label for="password">

            密碼

        </label>


        <input
            type="password"
            id="password"
            placeholder="請輸入密碼"
            autocomplete="current-password"
        >


        <button
            id="loginBtn"
            onclick="dealerLogin()"
        >

            登入

        </button>


        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>



    <!-- ==================================================
         後台首頁
    ================================================== -->

    <div
        id="dashboard"
    >


        <div class="header">

            <div>

                <div class="header-title">

                    三久太陽能｜經銷商後台

                </div>


                <div
                    id="dealerName"
                    class="dealer-name"
                ></div>

            </div>


            <button
                class="logout-btn"
                onclick="dealerLogout()"
            >

                登出

            </button>

        </div>



        <!-- ==================================================
             客戶列表
        ================================================== -->

        <div
            id="customerListPage"
        >

            <div class="card">

                <div class="card-title">

                    客戶資料

                </div>


                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="搜尋姓名、電話、地址、機型..."
                    oninput="filterCustomers()"
                >


                <div
                    id="customerList"
                    class="customer-list"
                >

                    <div class="loading">

                        正在讀取客戶資料...

                    </div>

                </div>

            </div>



            <!-- ==================================================
                 修改帳號密碼
            ================================================== -->

            <div class="card">

                <div class="card-title">

                    帳號設定

                </div>


                <div class="account-box">


                    <label for="newUsername">

                        新帳號

                    </label>


                    <input
                        type="text"
                        id="newUsername"
                        placeholder="輸入新的帳號"
                    >


                    <label for="newPassword">

                        新密碼

                    </label>


                    <input
                        type="password"
                        id="newPassword"
                        placeholder="輸入新的密碼"
                    >


                    <button
                        onclick="changeDealerAccount()"
                    >

                        修改帳號密碼

                    </button>


                    <div
                        id="accountMessage"
                        class="message"
                    ></div>

                </div>

            </div>

        </div>



        <!-- ==================================================
             客戶詳細資料
        ================================================== -->

        <div
            id="customerDetail"
        >


            <button
                class="back-btn"
                onclick="backToCustomers()"
            >

                ← 返回客戶列表

            </button>



            <!-- 客戶基本資料 -->

            <div class="card">

                <div class="card-title">

                    客戶資料

                </div>


                <div id="customerInfo"></div>

            </div>



            <!-- 客戶照片 -->

            <div class="card">

                <div class="card-title">

                    歷史照片

                </div>


                <div
                    id="photoGrid"
                    class="photo-grid"
                ></div>

            </div>



            <!-- 維修歷史 -->

            <div class="card">

                <div class="card-title">

                    維修歷史紀錄

                </div>


                <div
                    id="repairList"
                ></div>



                <!-- 新增維修 -->

                <div class="repair-form">


                    <div class="card-title">

                        新增維修紀錄

                    </div>


                    <label for="repairDate">

                        維修日期

                    </label>


                    <input
                        type="date"
                        id="repairDate"
                    >


                    <label for="repairType">

                        維修項目

                    </label>


                    <input
                        type="text"
                        id="repairType"
                        placeholder="例如：漏水、故障檢查、零件更換"
                    >


                    <label for="repairDescription">

                        維修內容

                    </label>


                    <textarea
                        id="repairDescription"
                        placeholder="請輸入維修詳細內容"
                    ></textarea>


                    <label for="repairTechnician">

                        技師

                    </label>


                    <input
                        type="text"
                        id="repairTechnician"
                        placeholder="請輸入技師姓名"
                    >


                    <label for="repairCost">

                        費用

                    </label>


                    <input
                        type="text"
                        id="repairCost"
                        placeholder="例如：1500"
                    >


                    <label for="repairNote">

                        備註

                    </label>


                    <textarea
                        id="repairNote"
                        placeholder="其他備註"
                    ></textarea>


                    <button
                        id="addRepairBtn"
                        onclick="addRepair()"
                    >

                        新增維修紀錄

                    </button>


                </div>

            </div>


        </div>


    </div>


</div>



<script>


// =====================================================
// Google Apps Script API
// =====================================================

const GOOGLE_API_URL =
    "https://script.google.com/macros/s/AKfycbwsi-SWa-LZ_fc7gEjtNxkOSg-ZrkigDxol2SxfYD058epCl81ToMeAC4iXCTXAYFSb9Q/exec";



// =====================================================
// 登入資訊
// =====================================================

let dealerToken =
    localStorage.getItem(
        "dealerToken"
    ) || "";


let currentDealerName =
    localStorage.getItem(
        "dealerName"
    ) || "";


let customers = [];


let currentCustomer = null;



// =====================================================
// 頁面啟動
// =====================================================

window.addEventListener(
    "load",
    function() {

        if (dealerToken) {

            showDashboard();

            loadCustomers();

        }

    }
);



// =====================================================
// 經銷商登入
// =====================================================

async function dealerLogin() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    const btn =
        document.getElementById(
            "loginBtn"
        );


    message.innerText = "";


    if (!username || !password) {

        message.innerText =
            "請輸入帳號與密碼";

        return;
    }


    btn.disabled = true;

    btn.innerText =
        "登入中...";


    try {

        const response =
            await fetch(
                GOOGLE_API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "dealerLogin",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        const data =
            await response.json();


        if (
            data.status ===
            "success"
        ) {

            dealerToken =
                data.token;


            currentDealerName =
                data.dealerName ||
                username;


            localStorage.setItem(
                "dealerToken",
                dealerToken
            );


            localStorage.setItem(
                "dealerName",
                currentDealerName
            );


            showDashboard();


            loadCustomers();


        } else {

            message.innerText =
                data.message ||
                "帳號或密碼錯誤";

        }


    } catch (error) {

        console.error(error);


        message.innerText =
            "無法連線到伺服器";

    } finally {

        btn.disabled = false;

        btn.innerText =
            "登入";

    }

}



// =====================================================
// 顯示後台
// =====================================================

function showDashboard() {

    document.getElementById(
        "loginPage"
    ).style.display =
        "none";


    document.getElementById(
        "dashboard"
    ).style.display =
        "block";


    document.getElementById(
        "dealerName"
    ).innerText =
        "經銷商：" +
        currentDealerName;

}



// =====================================================
// 讀取所有客戶
// =====================================================

async function loadCustomers() {

    const list =
        document.getElementById(
            "customerList"
        );


    list.innerHTML =
        '<div class="loading">正在讀取客戶資料...</div>';


    try {

        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getCustomers&token=" +
                encodeURIComponent(
                    dealerToken
                )

            );


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            if (
                data.message &&
                data.message.includes(
                    "登入"
                )
            ) {

                forceLogout();

                return;
            }


            list.innerHTML =
                '<div class="empty">' +
                (data.message ||
                    "讀取失敗") +
                '</div>';

            return;
        }


        customers =
            data.customers || [];


        renderCustomers(
            customers
        );


    } catch (error) {

        console.error(error);


        list.innerHTML =
            '<div class="empty">無法讀取客戶資料</div>';

    }

}



// =====================================================
// 顯示客戶列表
// =====================================================

function renderCustomers(listData) {

    const list =
        document.getElementById(
            "customerList"
        );


    list.innerHTML = "";


    if (
        !listData ||
        listData.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">' +
            '目前沒有客戶資料' +
            '</div>';

        return;
    }


    listData.forEach(
        function(customer) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "customer-item";


            item.onclick =
                function() {

                    openCustomer(
                        customer.userId
                    );

                };


            item.innerHTML = `

                <div class="customer-name">

                    ${escapeHtml(
                        customer.name ||
                        "未填寫姓名"
                    )}

                </div>

                <div class="customer-info">

                    電話：
                    ${escapeHtml(
                        customer.phone ||
                        "-"
                    )}

                    <br>

                    地址：
                    ${escapeHtml(
                        customer.address ||
                        "-"
                    )}

                    <br>

                    機型：
                    ${escapeHtml(
                        customer.model ||
                        "-"
                    )}

                    <br>

                    安裝日期：
                    ${escapeHtml(
                        customer.installDate ||
                        "-"
                    )}

                </div>

            `;


            list.appendChild(
                item
            );

        }
    );

}



// =====================================================
// 搜尋客戶
// =====================================================

function filterCustomers() {

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    if (!keyword) {

        renderCustomers(
            customers
        );

        return;
    }


    const filtered =
        customers.filter(
            function(customer) {

                const text =
                    [

                        customer.name,

                        customer.phone,

                        customer.address,

                        customer.model

                    ]
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    keyword
                );

            }
        );


    renderCustomers(
        filtered
    );

}



// =====================================================
// 開啟客戶詳細資料
// =====================================================

async function openCustomer(userId) {

    document.getElementById(
        "customerListPage"
    ).style.display =
        "none";


    document.getElementById(
        "customerDetail"
    ).style.display =
        "block";


    document.getElementById(
        "customerInfo"
    ).innerHTML =
        '<div class="loading">正在讀取客戶資料...</div>';


    document.getElementById(
        "photoGrid"
    ).innerHTML = "";


    document.getElementById(
        "repairList"
    ).innerHTML = "";


    try {

        const response =
            await fetch(

                GOOGLE_API_URL +
                "?action=getDealerCustomer" +
                "&token=" +
                encodeURIComponent(
                    dealerToken
                ) +
                "&customerUserId=" +
                encodeURIComponent(
                    userId
                )

            );


        const data =
            await response.json();


        if (
            data.status !==
            "success"
        ) {

            if (
                data.message &&
                data.message.includes(
                    "登入"
                )
            ) {

                forceLogout();

                return;
            }


            alert(
                data.message ||
                "讀取客戶資料失敗"
            );


            backToCustomers();

            return;
        }


        currentCustomer =
            data.customer;


        renderCustomerInfo(
            data.customer
        );


        renderPhotos(
            data.photos || []
        );


        renderRepairs(
            data.repairs || []
        );


        // 預設今天

        document.getElementById(
            "repairDate"
        ).value =
            new Date()
                .toISOString()
                .split("T")[0];


    } catch (error) {

        console.error(error);


        alert(
            "無法連線到伺服器"
        );


        backToCustomers();

    }

}



// =====================================================
// 顯示客戶資料
// =====================================================

function renderCustomerInfo(customer) {

    const box =
        document.getElementById(
            "customerInfo"
        );


    if (!customer) {

        box.innerHTML =
            '<div class="empty">找不到客戶資料</div>';

        return;
    }


    box.innerHTML = `

        <div class="info-row">

            <div class="info-label">
                姓名
            </div>

            <div class="info-value">
                ${escapeHtml(
                    customer.name || "-"
                )}
            </div>

        </div>


        <div class="info-row">

            <div class="info-label">
                電話
            </div>

            <div class="info-value">
                ${escapeHtml(
                    customer.phone || "-"
                )}
            </div>

        </div>


        <div class="info-row">

            <div class="info-label">
                地址
            </div>

            <div class="info-value">
                ${escapeHtml(
                    customer.address || "-"
                )}
            </div>

        </div>


        <div class="info-row">

            <div class="info-label">
                機型
            </div>

            <div class="info-value">
                ${escapeHtml(
                    customer.model || "-"
                )}
            </div>

        </div>


        <div class="info-row">

            <div class="info-label">
                安裝日期
            </div>

            <div class="info-value">
                ${escapeHtml(
                    customer.installDate || "-"
                )}
            </div>

        </div>

    `;

}



// =====================================================
// 顯示照片
// =====================================================

function renderPhotos(photos) {

    const grid =
        document.getElementById(
            "photoGrid"
        );


    grid.innerHTML = "";


    if (
        !photos ||
        photos.length === 0
    ) {

        grid.innerHTML =
            '<div class="empty">尚無歷史照片</div>';

        return;
    }


    photos.forEach(
        function(photo) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "photo-item";


            item.innerHTML = `

                <img
                    src="${escapeAttribute(
                        photo.url
                    )}"
                    alt="客戶照片"
                    onclick="window.open(
                        '${escapeAttribute(
                            photo.url
                        )}',
                        '_blank'
                    )"
                >


                <div class="photo-name">

                    ${escapeHtml(
                        photo.filename ||
                        ""
                    )}

                    <br>

                    ${escapeHtml(
                        photo.uploadTime ||
                        ""
                    )}

                </div>

            `;


            grid.appendChild(
                item
            );

        }
    );

}

// =====================================================
// 新增維修紀錄
// =====================================================

async function addRepair() {

    if (
        !currentCustomer ||
        !currentCustomer.userId
    ) {

        alert(
            "尚未選擇客戶"
        );

        return;
    }


    const repairDate =
        document.getElementById(
            "repairDate"
        ).value;


    const type =
        document.getElementById(
            "repairType"
        ).value.trim();


    const description =
        document.getElementById(
            "repairDescription"
        ).value.trim();


    const technician =
        document.getElementById(
            "repairTechnician"
        ).value.trim();


    const cost =
        document.getElementById(
            "repairCost"
        ).value.trim();


    const note =
        document.getElementById(
            "repairNote"
        ).value.trim();


    if (!repairDate) {

        alert(
            "請輸入維修日期"
        );

        return;
    }


    if (!type) {

        alert(
            "請輸入維修項目"
        );

        return;
    }


    const btn =
        document.getElementById(
            "addRepairBtn"
        );


    btn.disabled = true;

    btn.innerText =
        "儲存中...";


    try {

        const response =
            await fetch(

                GOOGLE_API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "dealerAddRepair",

                            token:
                                dealerToken,

                            customerUserId:
                                currentCustomer.userId,

                            repairDate:
                                repairDate,

                            type:
                                type,

                            description:
                                description,

                            technician:
                                technician,

                            cost:
                                cost,

                            note:
                                note

                        })

                }

            );


        const data =
            await response.json();


        if (
            data.status ===
            "success"
        ) {

            alert(
                "維修紀錄已新增"
            );


            // 清空表單

            document.getElementById(
                "repairType"
            ).value = "";


            document.getElementById(
                "repairDescription"
            ).value = "";


            document.getElementById(
                "repairTechnician"
            ).value = "";


            document.getElementById(
                "repairCost"
            ).value = "";


            document.getElementById(
                "repairNote"
            ).value = "";


            // 重新讀取客戶

            openCustomer(
                currentCustomer.userId
            );


        } else {

            alert(
                data.message ||
                "新增失敗"
            );

        }


    } catch (error) {

        console.error(error);


        alert(
            "無法連線到伺服器"
        );

    } finally {

        btn.disabled = false;

        btn.innerText =
            "新增維修紀錄";

    }

}



// =====================================================
// 修改經銷商帳號密碼
// =====================================================

async function changeDealerAccount() {

    const newUsername =
        document.getElementById(
            "newUsername"
        ).value.trim();


    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;


    const message =
        document.getElementById(
            "accountMessage"
        );


    message.innerText = "";


    if (!newUsername) {

        message.innerText =
            "請輸入新帳號";

        return;
    }


    if (!newPassword) {

        message.innerText =
            "請輸入新密碼";

        return;
    }


    if (
        newPassword.length < 6
    ) {

        message.innerText =
            "新密碼至少需要 6 個字元";

        return;
    }


    const confirmChange =
        confirm(
            "確定要修改帳號與密碼嗎？\n修改後需要使用新的帳號密碼重新登入。"
        );


    if (!confirmChange) {

        return;
    }


    try {

        const response =
            await fetch(

                GOOGLE_API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "changeDealerAccount",

                            token:
                                dealerToken,

                            newUsername:
                                newUsername,

                            newPassword:
                                newPassword

                        })

                }

            );


        const data =
            await response.json();


        if (
            data.status ===
            "success"
        ) {

            alert(
                "帳號密碼修改成功，請使用新帳號重新登入。"
            );


            forceLogout();


        } else {

            message.innerText =
                data.message ||
                "修改失敗";

        }


    } catch (error) {

        console.error(error);


        message.innerText =
            "無法連線到伺服器";

    }

}



// =====================================================

// =====================================================

async function dealerLogout() {

    try {

        if (dealerToken) {

            await fetch(

                GOOGLE_API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "dealerLogout",

                            token:
                                dealerToken

                        })

                }

            );

        }

    } catch (error) {

        console.error(error);

    }


    forceLogout();

}



// =====================================================
// 強制登出

function forceLogout() {

    dealerToken = "";

    currentDealerName = "";

    customers = [];

    currentCustomer = null;


    localStorage.removeItem(
        "dealerToken"
    );


    localStorage.removeItem(
        "dealerName"
    );


    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "loginPage"
    ).style.display =

    document.getElementById(
        "username"
    ).value = "";


    document.getElementById(
        "password"
    ).value = "";


    document.getElementById(
        "loginMessage"
    ).innerText = "";

}

// =====================================================
// HTML 安全處理
// =====================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =====================================================
// Attribute 安全處理
// =====================================================

function escapeAttribute(value) {

    return escapeHtml(
        value
    )
    .replace(
        /`/g,
        "&#096;"
    );

}
