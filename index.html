<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>三久太陽能｜經銷商後台</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f3f5f8;

    color: #333;
}


.container {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;
}


.card {

    background: white;

    border-radius: 14px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}


.logo {

    text-align: center;

    margin-bottom: 20px;
}


.logo img {

    width: 100%;

    max-width: 400px;

    height: auto;
}


h1 {

    text-align: center;

    color: #003C9D;

    font-size: 24px;

    margin-bottom: 20px;
}


h2 {

    font-size: 19px;

    color: #003C9D;

    margin-top: 0;
}


h3 {

    font-size: 17px;

    margin-bottom: 10px;
}


label {

    display: block;

    margin-top: 12px;

    margin-bottom: 6px;

    font-weight: bold;

    font-size: 14px;
}


input,
textarea,
select {

    width: 100%;

    padding: 11px;

    border: 1px solid #ddd;

    border-radius: 7px;

    font-size: 15px;

    background: white;
}


textarea {

    min-height: 90px;

    resize: vertical;
}


button {

    width: 100%;

    padding: 12px;

    margin-top: 15px;

    border: none;

    border-radius: 7px;

    background: #003C9D;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


button:hover {

    background: #002d75;
}


button:disabled {

    background: #999;

    cursor: not-allowed;
}


.secondary {

    background: #666;
}


.danger {

    background: #b00020;
}


.hidden {

    display: none !important;
}


.status {

    text-align: center;

    margin-top: 12px;

    color: #666;

    font-size: 14px;
}


.topbar {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 20px;
}


.topbar button {

    width: auto;

    padding: 8px 15px;

    margin: 0;

    font-size: 14px;
}


.dealer-name {

    font-weight: bold;

    color: #003C9D;
}


.search-box {

    display: flex;

    gap: 10px;
}


.search-box input {

    flex: 1;
}


.search-box button {

    width: 100px;

    margin: 0;
}


.customer-item {

    border: 1px solid #eee;

    border-radius: 10px;

    padding: 14px;

    margin-top: 10px;

    cursor: pointer;

    background: #fff;
}


.customer-item:hover {

    background: #f5f8ff;

    border-color: #003C9D;
}


.customer-name {

    font-size: 17px;

    font-weight: bold;

    color: #003C9D;
}


.customer-info {

    margin-top: 5px;

    color: #666;

    font-size: 14px;

    line-height: 1.7;
}


.detail-row {

    margin-bottom: 10px;

    line-height: 1.6;
}


.detail-label {

    font-weight: bold;

    color: #555;
}


.photo-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}


.photo-item {

    background: #f5f5f5;

    border-radius: 8px;

    overflow: hidden;

    border: 1px solid #ddd;
}


.photo-item img {

    width: 100%;

    display: block;
}


.photo-time {

    padding: 6px;

    font-size: 12px;

    color: #666;
}


.repair-item {

    border-left: 4px solid #003C9D;

    background: #f7f9fc;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 5px;
}


.repair-date {

    font-weight: bold;

    color: #003C9D;
}


.repair-title {

    font-weight: bold;

    margin-top: 5px;
}


.repair-content {

    margin-top: 5px;

    line-height: 1.6;
}


.empty {

    text-align: center;

    padding: 20px;

    color: #888;
}


@media (
    max-width: 600px
) {

    body {

        padding: 10px;
    }


    .card {

        padding: 15px;
    }


    .search-box {

        display: block;
    }


    .search-box button {

        width: 100%;

        margin-top: 10px;
    }


    .topbar {

        align-items: flex-start;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==================================================
     登入頁面
================================================== -->

<div
    id="loginPage"
    class="card"
>

    <div class="logo">

        <img
            src="https://i.ibb.co/chRL8DY0/logo.jpg"
            alt="三久太陽能"
        >

    </div>


    <h1>
        經銷商後台
    </h1>


    <label>
        帳號
    </label>

    <input
        type="text"
        id="loginUsername"
        placeholder="請輸入帳號"
        autocomplete="username"
    >


    <label>
        密碼
    </label>

    <input
        type="password"
        id="loginPassword"
        placeholder="請輸入密碼"
        autocomplete="current-password"
    >


    <button
        id="loginButton"
        onclick="dealerLogin()"
    >
        登入
    </button>


    <div
        id="loginStatus"
        class="status"
    ></div>

</div>



<!-- ==================================================
     第一次登入修改帳號密碼
================================================== -->

<div
    id="changePasswordPage"
    class="card hidden"
>

    <h1>
        第一次登入
    </h1>


    <p>
        為了保護您的帳號安全，
        第一次登入必須修改帳號與密碼。
    </p>


    <label>
        新帳號
    </label>

    <input
        type="text"
        id="newUsername"
        placeholder="至少 4 個字元"
        autocomplete="username"
    >


    <label>
        新密碼
    </label>

    <input
        type="password"
        id="newPassword"
        placeholder="至少 8 個字元"
        autocomplete="new-password"
    >


    <label>
        確認新密碼
    </label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="再次輸入新密碼"
        autocomplete="new-password"
    >


    <button
        onclick="changeCredentials()"
    >
        儲存新帳號密碼
    </button>


    <div
        id="changeStatus"
        class="status"
    ></div>

</div>



<!-- ==================================================
     後台
================================================== -->

<div
    id="dashboardPage"
    class="hidden"
>


    <div class="topbar">

        <div>

            <div class="dealer-name">
                三久太陽能
            </div>

            <div id="dealerDisplayName">
                經銷商
            </div>

        </div>


        <button
            class="secondary"
            onclick="logout()"
        >
            登出
        </button>

    </div>



    <!-- ==================================================
         客戶搜尋
    ================================================== -->

    <div class="card">

        <h2>
            客戶搜尋
        </h2>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="輸入姓名、電話、地址搜尋"
                oninput="filterCustomers()"
            >

            <button
                onclick="loadCustomers()"
            >
                重新整理
            </button>

        </div>


        <div
            id="customerList"
            class="status"
        >
            正在讀取客戶資料...
        </div>

    </div>



    <!-- ==================================================
         客戶詳細資料
    ================================================== -->

    <div
        id="customerDetail"
        class="card hidden"
    >

        <h2>
            客戶資料
        </h2>


        <div
            id="customerInfo"
        ></div>


        <hr>


        <h2>
            歷史照片
        </h2>


        <div
            id="photoList"
            class="photo-grid"
        ></div>


        <hr>


        <h2>
            維修歷史
        </h2>


        <div
            id="repairList"
        ></div>


        <hr>


        <h2>
            新增維修紀錄
        </h2>


        <label>
            維修日期
        </label>

        <input
            type="date"
            id="repairDate"
        >


        <label>
            維修項目
        </label>

        <input
            type="text"
            id="repairType"
            placeholder="例如：熱水器檢查"
        >


        <label>
            維修內容
        </label>

        <textarea
            id="repairDescription"
            placeholder="請輸入維修內容"
        ></textarea>


        <label>
            技師
        </label>

        <input
            type="text"
            id="repairTechnician"
            placeholder="請輸入技師姓名"
        >


        <label>
            費用
        </label>

        <input
            type="text"
            id="repairCost"
            placeholder="例如：1500"
        >


        <label>
            備註
        </label>

        <textarea
            id="repairNote"
            placeholder="其他備註"
        ></textarea>
